name: Deploy AWS SAM

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup AWS SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Create SAM S3 Bucket if missing
        run: |
          BUCKET_NAME="sam-deploy-${{ secrets.AWS_REGION }}-${{ github.repository_owner_id }}"
          if ! aws s3api head-bucket --bucket "$BUCKET_NAME" 2>/dev/null; then
            aws s3 mb s3://$BUCKET_NAME --region ${{ secrets.AWS_REGION }}
          fi
          echo "SAM_BUCKET=$BUCKET_NAME" >> $GITHUB_ENV

      - name: Build SAM
        run: sam build

      - name: Deploy SAM Stack
        run: |
          sam deploy \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --stack-name essoufi-billard \
            --s3-bucket ${{ env.SAM_BUCKET }} \
            --capabilities CAPABILITY_IAM \
            --region ${{ secrets.AWS_REGION }} \
            --parameter-overrides OwnerEmail=${{ secrets.OWNER_EMAIL }} CreateSesIdentity=false

      - name: Upload Frontend to S3
        run: |
          SITE_BUCKET=$(aws cloudformation describe-stacks --stack-name essoufi-billard --query "Stacks[0].Outputs[?OutputKey=='SiteBucketName'].OutputValue" --output text)
          aws s3 sync frontend/ s3://$SITE_BUCKET/ --delete

      - name: Print Outputs
        run: |
          SITE_URL=$(aws cloudformation describe-stacks --stack-name essoufi-billard --query "Stacks[0].Outputs[?OutputKey=='SiteUrl'].OutputValue" --output text)
          ADMIN_URL=$(aws cloudformation describe-stacks --stack-name essoufi-billard --query "Stacks[0].Outputs[?OutputKey=='AdminUrl'].OutputValue" --output text)
          echo "=========================================="
          echo "Boutique : $SITE_URL"
          echo "Admin    : $ADMIN_URL"
          echo "=========================================="
