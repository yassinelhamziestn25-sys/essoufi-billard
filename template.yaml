AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: essoufi-billard - boutique et gestion en ligne

Parameters:
  OwnerEmail:
    Type: String
    Description: Votre email administrateur.
  CreateSesIdentity:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: Mettre 'false' si cet email est déjà vérifié dans SES.
  TelegramBotToken:
    Type: String
    Default: ''
    NoEcho: true
  TelegramChatId:
    Type: String
    Default: ''
  WhatsAppToken:
    Type: String
    Default: ''
    NoEcho: true
  WhatsAppPhoneId:
    Type: String
    Default: ''
  WhatsAppTemplateOwner:
    Type: String
    Default: ''
  WhatsAppTemplateClient:
    Type: String
    Default: ''

Conditions:
  MakeSesIdentity: !Equals [!Ref CreateSesIdentity, 'true']

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 20
    MemorySize: 256

Resources:
  # ---------- Données ----------
  ProductsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: id, AttributeType: S}]
      KeySchema: [{AttributeName: id, KeyType: HASH}]
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}

  OrdersTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: id, AttributeType: S}]
      KeySchema: [{AttributeName: id, KeyType: HASH}]
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}

  ConfigTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: id, AttributeType: S}]
      KeySchema: [{AttributeName: id, KeyType: HASH}]

  # ---------- Fichiers ----------
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration: {BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true}

  ImagesBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration: {BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true}
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [POST]
            AllowedOrigins: ['*']
            AllowedHeaders: ['*']
            MaxAge: 3000

  OAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: {Service: cloudfront.amazonaws.com}
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}'

  ImagesBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ImagesBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: {Service: cloudfront.amazonaws.com}
            Action: s3:GetObject
            Resource: !Sub '${ImagesBucket.Arn}/img/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}'

  # ---------- Authentification Admin ----------
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${AWS::StackName}-admin'
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
        InviteMessageTemplate:
          EmailSubject: Accès administration essoufi-billard
          EmailMessage: 'Votre identifiant : {username}. Mot de passe temporaire : {####}. Ouvrez votre-site/admin et changez-le à la première connexion.'
      Policies:
        PasswordPolicy:
          MinimumLength: 10
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
      AccountRecoverySetting:
        RecoveryMechanisms: [{Name: verified_email, Priority: 1}]

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_USER_PASSWORD_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED
      RefreshTokenValidity: 30
      AccessTokenValidity: 60
      IdTokenValidity: 60
      TokenValidityUnits: {AccessToken: minutes, IdToken: minutes, RefreshToken: days}

  AdminUser:
    Type: AWS::Cognito::UserPoolUser
    Properties:
      UserPoolId: !Ref UserPool
      Username: !Ref OwnerEmail
      DesiredDeliveryMediums: [EMAIL]
      UserAttributes:
        - {Name: email, Value: !Ref OwnerEmail}
        - {Name: email_verified, Value: 'true'}

  # ---------- Emails ----------
  OwnerSesIdentity:
    Type: AWS::SES::EmailIdentity
    Condition: MakeSesIdentity
    Properties:
      EmailIdentity: !Ref OwnerEmail

  # ---------- API Backend ----------
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      DefaultRouteSettings:
        ThrottlingBurstLimit: 30
        ThrottlingRateLimit: 15
      Auth:
        Authorizers:
          CognitoJwt:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}'
              audience: [!Ref UserPoolClient]

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: src/index.handler
      Environment:
        Variables:
          PRODUCTS_TABLE: !Ref ProductsTable
          ORDERS_TABLE: !Ref OrdersTable
          CONFIG_TABLE: !Ref ConfigTable
          IMAGES_BUCKET: !Ref ImagesBucket
          USER_POOL_CLIENT_ID: !Ref UserPoolClient
          OWNER_EMAIL: !Ref OwnerEmail
          SENDER_EMAIL: !Ref OwnerEmail
          TELEGRAM_BOT_TOKEN: !Ref TelegramBotToken
          TELEGRAM_CHAT_ID: !Ref TelegramChatId
          WA_TOKEN: !Ref WhatsAppToken
          WA_PHONE_ID: !Ref WhatsAppPhoneId
          WA_TEMPLATE_OWNER: !Ref WhatsAppTemplateOwner
          WA_TEMPLATE_CLIENT: !Ref WhatsAppTemplateClient
      Policies:
        - DynamoDBCrudPolicy: {TableName: !Ref ProductsTable}
        - DynamoDBCrudPolicy: {TableName: !Ref OrdersTable}
        - DynamoDBCrudPolicy: {TableName: !Ref ConfigTable}
        - Statement:
            - Effect: Allow
              Action: s3:PutObject
              Resource: !Sub '${ImagesBucket.Arn}/img/*'
            - Effect: Allow
              Action: [ses:SendEmail]
              Resource: '*'
      Events:
        PublicConfig:
          Type: HttpApi
          Properties: {ApiId: !Ref HttpApi, Path: /api/config, Method: GET}
        Catalog:
          Type: HttpApi
          Properties: {ApiId: !Ref HttpApi, Path: /api/catalog, Method: GET}
        CreateOrder:
          Type: HttpApi
          Properties: {ApiId: !Ref HttpApi, Path: /api/orders, Method: POST}
        Admin:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/admin/{proxy+}
            Method: ANY
            Auth: {Authorizer: CognitoJwt}

  # ---------- Distribution CloudFront ----------
  RewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub '${AWS::StackName}-rewrite'
      AutoPublish: true
      FunctionConfig: {Comment: /admin vers /admin/index.html, Runtime: cloudfront-js-2.0}
      FunctionCode: |
        function handler(event) {
          var r = event.request;
          if (r.uri === '/admin' || r.uri === '/admin/') { r.uri = '/admin/index.html'; }
          return r;
        }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        DefaultRootObject: index.html
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OAC.Id
            S3OriginConfig: {OriginAccessIdentity: ''}
          - Id: images
            DomainName: !GetAtt ImagesBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OAC.Id
            S3OriginConfig: {OriginAccessIdentity: ''}
          - Id: api
            DomainName: !Sub '${HttpApi}.execute-api.${AWS::Region}.amazonaws.com'
            CustomOriginConfig: {OriginProtocolPolicy: https-only, OriginSSLProtocols: [TLSv1.2]}
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fc7-b769-08342213838b
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt RewriteFunction.FunctionARN
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
          - PathPattern: /img/*
            TargetOriginId: images
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            CachePolicyId: 658327ea-f89d-4fc7-b769-08342213838b

Outputs:
  SiteUrl:
    Value: !Sub 'https://${Distribution.DomainName}'
  AdminUrl:
    Value: !Sub 'https://${Distribution.DomainName}/admin'
  SiteBucketName:
    Value: !Ref SiteBucket
  DistributionId:
    Value: !Ref Distribution
